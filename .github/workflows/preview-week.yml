name: Preview week

# Makes the next posters in advance and opens a pull request so you can look at them.
# Merge the pull request = approve. Approved posters are posted on their day.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead"
        type: number
        default: 7

permissions:
  contents: write
  issues: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          sudo apt-get install -y -q libraqm0 >/dev/null || true
          pip install -q -r requirements.txt
      - run: python -m pytest -q

      - name: Make the posters
        id: preview
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_IMAGE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/review/${{ github.run_id }}
        run: python -m bot.main preview --days ${{ inputs.days }}

      - name: Open a pull request for your approval
        if: steps.preview.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="review/${{ github.run_id }}"
          git config user.name "mezmurfaith-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add docs/queue
          git commit -q -m "Posters waiting for approval"
          git push -q origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "Approve the next ${{ steps.preview.outputs.count }} verse posters" \
            --body-file state/preview.md
