name: Search Instagram audio

# Read-only: lists songs Instagram allows apps to use. Posts nothing.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Search words, separated by commas"
        default: "mezmur,tigrinya mezmur,eritrean orthodox,tewahedo,ethiopian orthodox"

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Search
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          QUERIES: ${{ inputs.queries }}
        run: |
          IFS=',' read -ra Q <<< "$QUERIES"
          python -m bot.main search-audio "${Q[@]}" ""
