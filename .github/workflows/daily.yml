name: Daily verse

on:
  schedule:
    # GitHub uses UTC and ignores daylight saving time, so we run at both possible
    # UTC times. The bot itself only posts once it's 7:00 AM or later in Chicago,
    # and never twice on the same day.
    - cron: "0 12 * * *"   # 7:00 AM Chicago in summer (CDT)
    - cron: "0 13 * * *"   # 7:00 AM Chicago in winter (CST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: make the poster but DON'T post it"
        type: boolean
        default: true
      force:
        description: "Run even if it's before 7:00 AM Chicago time"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-verse
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y -q libraqm0 >/dev/null || true
          pip install -q -r requirements.txt

      - name: Safety tests (nothing is posted if any fail)
        run: python -m pytest -q

      - name: Make today's poster
        id: prepare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bot.main prepare ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Download link for the test poster
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: test-poster
          path: output/
          if-no-files-found: ignore

      - name: Put the poster online
        if: steps.prepare.outputs.ready == 'true'
        run: |
          git config user.name "mezmurfaith-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/posters
          git diff --cached --quiet || git commit -q -m "Poster for $(TZ=America/Chicago date +%F)"
          git pull -q --rebase && git push -q

      - name: Post to Instagram
        if: steps.prepare.outputs.ready == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bot.main publish

      - name: Save today's verse for the app
        if: always() && steps.prepare.outputs.ready == 'true'
        run: |
          git add docs verses.json
          git diff --cached --quiet || git commit -q -m "Posted verse for $(TZ=America/Chicago date +%F)"
          git pull -q --rebase && git push -q

      - name: Tell me if something unexpected broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f state/notified ] && exit 0
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[verse bot] Daily run failed" \
            --body "Something went wrong and today's verse may not have been posted. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
